
name: Build Kharjyar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.10"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kharjyar-apk
          path: ${{ steps.build.outputs.archive-path }}
          if-no-files-found: error
          compression-level: 0
          
